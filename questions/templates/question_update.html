<!-- /templates/question_update_form.html -->
{% extends 'base.html' %} {% block content %}
<div class="container">
  <h1>질문 수정하기</h1>
  <form action="/questions/{{question.id}}/update" method="post">
    {% csrf_token %}
    <textarea name="subject" placeholder="제목을 입력하세요" required>{{question.subject}}</textarea>
    <textarea name="content" placeholder="내용을 입력하세요" required>{{question.content}}</textarea>
    <button type="submit">등록</button>
  </form>
</div>
{% endblock %}
